<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUuNA - もうひとりのスゥナ -</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Yu Gothic", "Meiryo", sans-serif;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
}

.noise-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255, 0, 0, 0.08) 0px,
            rgba(255, 0, 0, 0.08) 2px,
            transparent 2px,
            transparent 6px
        );
    z-index: 1;
}

.noise-bg.active {
    opacity: 1;
    animation: noiseFlicker 0.2s infinite;
}

@keyframes noiseFlicker {
    0% { transform: translate(0,0); opacity: 0.15; }
    50% { transform: translate(2px,-2px); opacity: 0.35; }
    100% { transform: translate(-1px,1px); opacity: 0.2; }
}

.game {
    position: relative;
    z-index: 2;
    max-width: 520px;
    margin: 0 auto;
    padding: 14px;
}

.title {
    text-align: center;
    margin-bottom: 12px;
}

.title h1 {
    font-size: 28px;
    margin: 8px 0 2px;
    letter-spacing: 2px;
}

.title p {
    margin: 0;
    color: #d8f5dc;
    font-size: 14px;
}

.card {
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 12px;
    backdrop-filter: blur(4px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}

.status-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 14px;
}

.bar-wrap {
    margin-top: 6px;
    height: 12px;
    background: rgba(0,0,0,0.4);
    border-radius: 999px;
    overflow: hidden;
}

.bar {
    height: 100%;
    width: 100%;
    transition: width 0.3s;
}

.hp {
    background: linear-gradient(90deg, #77e38a, #e6ff8f);
}

.noisehp {
    background: linear-gradient(90deg, #ff5656, #b600ff);
}

.resonance {
    background: linear-gradient(90deg, #ffe66d, #ff3333);
}

.characters {
    display: flex;
    justify-content: space-around;
    align-items: center;
    min-height: 150px;
}

.char {
    text-align: center;
    width: 45%;
}

.face {
    font-size: 58px;
    line-height: 1;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.25));
}

.noise-face {
    animation: pulse 1.2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(255,0,0,0.4)); }
    50% { transform: scale(1.07); filter: drop-shadow(0 0 18px rgba(255,0,0,0.9)); }
    100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(255,0,0,0.4)); }
}

.vs {
    font-size: 22px;
    color: #ffdddd;
    opacity: 0.8;
}

button {
    border: none;
    border-radius: 12px;
    padding: 12px 10px;
    font-size: 15px;
    font-weight: bold;
    color: #102014;
    background: #d8ffd8;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.3);
}

button:active {

    transform:
        scale(0.96);

    box-shadow:
        0 0 4px rgba(255,255,255,0.15);

}

button.danger {
    background: #ffb1b1;
}

button.dark {
    background: #d2b5ff;
}

button.small {
    font-size: 13px;
    padding: 8px;
}

.button-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.adventure-options {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
}

.log {
    height: 170px;
    overflow-y: auto;
    background: rgba(0,0,0,0.35);
    border-radius: 12px;
    padding: 10px;
    font-size: 13px;
    line-height: 1.6;
}

.log p {
    margin: 0 0 6px;
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    font-size: 13px;
}

.stat-box {
    background: rgba(0,0,0,0.22);
    padding: 8px;
    border-radius: 10px;
}

.upgrade-row {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:6px;
    margin-bottom:6px;
    font-size:13px;
}

.hidden {
    display: none;
}

.result {
    text-align: center;
    font-size: 18px;
    line-height: 1.7;
}

.warning {
    color: #ff8b8b;
    font-weight: bold;
}

.good {
    color: #a8ffb5;
    font-weight: bold;
}

.footer-note {
    text-align: center;
    opacity: 0.65;
    font-size: 11px;
    margin-top: 10px;
}
.modalOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.75);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
    padding:16px;
}

.modalContent{
    width:100%;
    max-width:520px;
    max-height:85vh;
    overflow-y:auto;

    background:
        linear-gradient(
            180deg,
            rgba(30,40,35,0.98),
            rgba(10,15,12,0.98)
        );

    border:1px solid rgba(255,255,255,0.15);
    border-radius:20px;
    padding:16px;
}

.modalTitle{
    font-size:20px;
    margin-bottom:12px;
    text-align:center;
}

.closeBtn{
    width:100%;
    margin-top:14px;
}

.startScreen{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:black;
    z-index:1000;
}

.bgVideo{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;

    opacity:0.8;
}

.startOverlay{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,0.2),
            rgba(0,0,0,0.55)
        );
}

.startContent{
    position:relative;
    z-index:2;

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:24px;
}

.titleLogo{
    width:min(95vw,560px);

    animation:
        logoFloat 4s ease-in-out infinite;

    filter:
        drop-shadow(0 0 18px rgba(255,255,255,0.18));
}

@keyframes logoFloat{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-8px);
    }

    100%{
        transform:translateY(0px);
    }

}

.startButton{

    position:relative;

    margin-top:40px;

    width:220px;

    font-size:20px;
    letter-spacing:4px;

    padding:16px;

    border-radius:14px;

    color:white;

    background:
        rgba(0,0,0,0.45);

    border:
        1px solid
        rgba(255,255,255,0.22);

    backdrop-filter:blur(6px);

    cursor:pointer;

    overflow:hidden;

    transition:
        transform 0.12s,
        box-shadow 0.25s,
        border-color 0.25s;

    box-shadow:
        0 0 12px rgba(170,120,255,0.18),
        0 0 28px rgba(120,0,255,0.12);

    animation:
        startPulse 3s ease-in-out infinite;
}

.startButton:hover{

    border-color:
        rgba(210,170,255,0.85);

    box-shadow:
        0 0 10px rgba(220,180,255,0.45),
        0 0 24px rgba(140,0,255,0.35),
        0 0 48px rgba(140,0,255,0.22);

    transform:
        translateY(-2px);

}

.startButton::before{

    content:"";

    position:absolute;
    inset:0;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0px,
            rgba(255,255,255,0.06) 2px,
            transparent 4px
        );

    opacity:0;

    transition:opacity 0.25s;

    mix-blend-mode:screen;

}

.startButton:hover::before{

    opacity:1;

    animation:
        buttonNoise 0.15s infinite;

}

@keyframes buttonNoise{

    0%{
        transform:translateX(0px);
    }

    25%{
        transform:translateX(-1px);
    }

    50%{
        transform:translateX(1px);
    }

    75%{
        transform:translateX(-1px);
    }

    100%{
        transform:translateX(0px);
    }

}

@keyframes startPulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.03);
    }

    100%{
        transform:scale(1);
    }

}
.topButtons{
    margin-top:40px;

    display:flex;
    flex-direction:column;
    gap:14px;

    width:220px;
}

.storyScreen{
    position:fixed;
    inset:0;

    background:#050706;

    z-index:2000;

    overflow:hidden;
}

.storyImage{

    position:absolute;

    height:100vh;
    width:auto;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    animation:
        storyFade 0.5s;

}

@keyframes storyFade{

    from{
        opacity:0;
        transform:scale(1.03);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

.storyOverlay{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,0.2),
            rgba(0,0,0,0.7)
        );
}

.storyContent{
    position:relative;
    z-index:2;

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:center;

    padding:40px 24px;
}

.storyText{
    font-size:16px;
    line-height:1.8;

    text-align:center;

    margin-bottom:40px;

    text-shadow:
        0 0 10px rgba(0,0,0,0.8);
}

.storyTextAnimate{
    animation:
        storyTextFade 0.8s;
}

@keyframes storyTextFade{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0px);
    }

}

#fieldScreen{

    min-height:100vh;

    background-image:
        linear-gradient(
            rgba(0,0,0,0.25),
            rgba(0,0,0,0.45)
        ),
        url("field_bg.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    padding:14px;

}

#noiseBattleScreen{

    min-height:100vh;

    padding:14px;

    background-image:
        linear-gradient(
            rgba(0,0,0,0.45),
            rgba(0,0,0,0.82)
        ),
        url("noise_bg.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

}

</style>
</head>

<body>
<div id="noiseBg" class="noise-bg"></div>

<div class="game">

    <div id="startScreen" class="startScreen">

        <video
            class="bgVideo"
            autoplay
            muted
                loop
        playsinline
        >
            <source src="bg.mp4" type="video/mp4">
        </video>

        <div class="startOverlay"></div>

        <div class="startContent">
    
            <img
                src="title_logo.png"
                class="titleLogo"
            >

            <div class="topButtons">

                <button
                    class="startButton"
                    onclick="openStory()"
                >
                    STORY
                </button>

                <button
                    class="startButton"
                    onclick="startGame()"
                >
                    START
                </button>

            </div>

        </div>

    </div>

    <div id="mainGame" class="hidden">
    	<div id="fieldScreen">
	        <div class="card">
	            <div class="status-row">
	                <span>スゥナ HP：<span id="suunaHpText"></span></span>
	                <span>pt：<span id="pointText"></span></span>
	            </div>
	            <div class="bar-wrap">
	                <div id="suunaHpBar" class="bar hp"></div>
	            </div>

	            <div class="status-row" style="margin-top:10px;">
	                <span>共鳴率：<span id="resonanceText"></span>%</span>
	                <span>冒険数：<span id="turnText"></span></span>
	            </div>
	            <div class="bar-wrap">
	                <div id="resonanceBar" class="bar resonance"></div>
	            </div>
	        </div>

	        <div class="card characters">
	            <div class="char">
	                <div class="face">🌿</div>
	                <div>スゥナ</div>
	            </div>
	            <div class="vs">VS</div>
	            <div class="char">
	                <div class="face noise-face">🟥</div>
	                <div>NOISE</div>
	            </div>
	        </div>

	        <div id="choiceArea" class="card">
	            <div class="button-grid">
	                <button onclick="showAdventureOptions()">冒険する</button>
	                <button class="danger" onclick="startNoiseBattle()">NOISEに挑む</button>
	                <button onclick="openUpgrade()">強化</button>
	                <button onclick="openStatus()">ステータス</button>
	            </div>
	        </div>

	        <div id="adventureArea" class="card hidden">
	            <p>どの道を進む？</p>
	            <div id="adventureOptions" class="adventure-options"></div>
	        </div>
		    <div class="card">
		        <h3>ログ</h3>
		        <div id="fieldLog" class="log"></div>
		    </div>

		    <div class="footer-note">
		        MVP Prototype Ver.0.1
		    </div>
	    </div>

	    <div id="noiseBattleScreen" class="hidden">

	        <div id="battleArea" class="card hidden">
	            <h3>NOISE戦</h3>
				<div class="status-row">

				    <span>
				        スゥナ HP：
				        <span id="battleSuunaHpText"></span>
				    </span>

				    <span>
				        NOISE HP：
				        <span id="noiseHpText"></span>
				    </span>

				</div>

				<div class="bar-wrap">
				    <div
				        id="battleSuunaHpBar"
				        class="bar hp"
				    ></div>
				</div>

				<div class="bar-wrap" style="margin-top:8px;">
				    <div
				        id="noiseHpBar"
				        class="bar noisehp"
				    ></div>
				</div>

				<div
				    class="status-row"
				    style="margin-top:10px;"
				>
				    <span>
				        Turn：
				        <span id="battleTurnText"></span>
				    </span>
				</div>
	            <button id="battleButton" class="dark" style="width:100%; margin-top:10px;" onclick="battleTurn()">次のターン</button>
	        </div>
		    <div class="card">
		        <h3>ログ</h3>
		        <div id="battleLog" class="log"></div>
		    </div>

		    <div class="footer-note">
		        MVP Prototype Ver.0.1
		    </div>
	    </div>



    </div>
</div>
<div id="upgradeModal" class="modalOverlay">

    <div class="modalContent">

        <div class="modalTitle">
            強化
        </div>

        <div id="upgradeList"></div>

        <button
            class="closeBtn"
            onclick="closeModal('upgradeModal')"
        >
            閉じる
        </button>

    </div>

</div>
<div id="statusModal" class="modalOverlay">

    <div class="modalContent">

        <div class="modalTitle">
            ステータス
        </div>

        <div class="stats">

            <div class="stat-box">
                攻撃力：
                <span id="atkText"></span>
            </div>

            <div class="stat-box">
                振れ幅：
                <span id="rangeText"></span>
            </div>

            <div class="stat-box">
                シールド：
                <span id="shieldText"></span>
            </div>

            <div class="stat-box">
                残留：
                <span id="remainText"></span>%
            </div>

            <div class="stat-box">
                回復：
                <span id="healText"></span>
            </div>

            <div class="stat-box">
                解除率：
                <span id="cleanseText"></span>%
            </div>

            <div class="stat-box">
                攻撃値：
                <span id="actAtkText"></span>
            </div>

            <div class="stat-box">
                防御値：
                <span id="actDefText"></span>
            </div>

            <div class="stat-box">
                回復値：
                <span id="actHealText"></span>
            </div>

            <div class="stat-box">
                失敗値：
                <span id="actFailText"></span>
            </div>

        </div>

        <button
            class="closeBtn"
            onclick="closeModal('statusModal')"
        >
            閉じる
        </button>

    </div>

</div>

<div
    id="storyScreen"
    class="storyScreen hidden"
>

    <img
        id="storyImage"
        class="storyImage"
        src=""
    >

    <div class="storyOverlay"></div>

    <div class="storyContent">

        <div
            id="storyText"
            class="storyText"
        ></div>

		<button
		    id="nextStoryButton"
		    class="startButton"
		    onclick="nextStory()"
		>
		    NEXT
		</button>

        <button
            id="storyStartButton"
            class="startButton hidden"
            onclick="startFromStory()"
        >
            START
        </button>

    </div>

</div>

<script>
let game;

let storyIndex = 0;

const storyPages = [

    {
        image:"story1.png",
        text:`
人々の願いが集まる場所。
そこでは今日も、たくさんの想いがカードに込められていた。

「勝ちたい」
「負けたくない」
「あと一枚、引ければ――」

スゥナは、そんな想いを受け止め続けていた。
けれど、願いの中には少しずつ、

怒り、憎しみ、焦り――
“負の感情”も混ざり始めていた。
`
    },

    {
        image:"story2.png",
        text:`
そして、ある日。
積み重なった負の感情は限界を超える。

スゥナの中から溢れ出した“それ”は、
黒いノイズとなって姿を変えた。

――NOISE。

それは、スゥナから生まれた
“もうひとりのスゥナ”だった。
`
    },

    {
        image:"story3.png",
        text:`
NOISEはスゥナの力を奪い、
世界へと侵食を広げていく。

勝つためなら何をしてもいい。
不正、イカサマ、破壊――

人々の負の感情はさらに膨れ上がり、
NOISEはより強くなっていった。

このままでは、世界は
“ノイズ”に飲み込まれてしまう。
`
    },

    {
        image:"story4.png",
        text:`
NOISEを止めるために――

スゥナは旅に出る。

自分から生まれた“もうひとり”を、
救うために。

けれど、スゥナひとりでは戦えない。

だから――

あなたの力を、貸してほしい。

これは、
スゥナと“NOISE”の物語。

そして、
あなたが導く旅の記録。
`
    }

];

function startGame() {

	document
	    .getElementById("startScreen")
	    .classList.add("hidden");

	document
	    .getElementById("storyScreen")
	    .classList.add("hidden");
    
    game = {
    	deck: [],
    	discard: [],
    	noiseDeck: [],
		noiseDiscard: [],
        maxHp: 200,
        hp: 200,
        point: 0,
        resonance: 0,
        adventureCount: 0,

        atk: 10,
        range: 10,
        shieldValue: 10,
        remain: 10,
        heal: 10,
        cleanse: 10,

        actionAtk: 10,
        actionDef: 10,
        actionHeal: 10,
        actionFail: 10,

        shield: 0,

        noiseMaxHp: 200,
        noiseHp: 200,
        noiseShield: 0,
        battleTurn: 0,
        inBattle: false
    };

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("mainGame").classList.remove("hidden");

    log("スゥナは森へ足を踏み入れた。");

    buildDeck("suuna");
	buildDeck("noise");
    updateView();
}

function rand(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function log(text) {
	const fieldLog =
	    document.getElementById(
	        "fieldLog"
	    );

	const battleLog =
	    document.getElementById(
	        "battleLog"
	    );

	const p1 =
	    document.createElement("p");

	p1.innerHTML = text;

	fieldLog.prepend(p1);

	const p2 =
	    document.createElement("p");

	p2.innerHTML = text;

	battleLog.prepend(p2);
}

function updateView() {
    document.getElementById("suunaHpText").innerText = `${game.hp}/${game.maxHp}`;
    document.getElementById("pointText").innerText = game.point;
    document.getElementById("resonanceText").innerText = Math.floor(game.resonance);
    document.getElementById("turnText").innerText = game.adventureCount;

    document.getElementById("suunaHpBar").style.width = `${Math.max(0, game.hp / game.maxHp * 100)}%`;
    document.getElementById("resonanceBar").style.width = `${Math.min(100, game.resonance)}%`;

    document.getElementById("atkText").innerText = game.atk;
    document.getElementById("rangeText").innerText = game.range;
    document.getElementById("shieldText").innerText = game.shieldValue;
    document.getElementById("remainText").innerText = game.remain;
    document.getElementById("healText").innerText = game.heal;
    document.getElementById("cleanseText").innerText = game.cleanse;

    document.getElementById("actAtkText").innerText = game.actionAtk;
    document.getElementById("actDefText").innerText = game.actionDef;
    document.getElementById("actHealText").innerText = game.actionHeal;
    document.getElementById("actFailText").innerText = game.actionFail;

    if (game.inBattle) {
        document.getElementById("noiseHpText").innerText = `${game.noiseHp}/${game.noiseMaxHp}`;
        document.getElementById("battleTurnText").innerText = game.battleTurn;
        document.getElementById("noiseHpBar").style.width = `${Math.max(0, game.noiseHp / game.noiseMaxHp * 100)}%`;
        document
		    .getElementById(
		        "battleSuunaHpText"
		    )
		    .innerText =
		    `${game.hp}/${game.maxHp}`;

		document
		    .getElementById(
		        "battleSuunaHpBar"
		    )
		    .style.width =
		    `${Math.max(
		        0,
		        game.hp / game.maxHp * 100
		    )}%`;
    }

    document.getElementById("noiseBg").classList.toggle("active", game.resonance >= 60);

    renderUpgrades();
}

function showAdventureOptions() {
    if (game.inBattle) return;

    const types = ["残滓戦", "ランダムイベント", "回復"];
    const shuffled = types.sort(() => Math.random() - 0.5);
    const selected = shuffled.slice(0, 2);

    const area = document.getElementById("adventureOptions");
    area.innerHTML = "";

    selected.forEach(type => {
        const btn = document.createElement("button");
        btn.innerText = type;
        btn.onclick = () => doAdventure(type);
        area.appendChild(btn);
    });

    document.getElementById("adventureArea").classList.remove("hidden");
}

function doAdventure(type) {
    document.getElementById("adventureArea").classList.add("hidden");
    game.adventureCount++;

    if (type === "残滓戦") {
        const damage = rand(15, 35);
        const reward = rand(20, 30);
        game.hp -= damage;
        game.point += reward;
        game.resonance += rand(8, 12);

        log(`<span class="warning">残滓戦。</span> スゥナは${damage}ダメージを受け、${reward}ptを得た。`);
    }

    if (type === "ランダムイベント") {
        randomEvent();
    }

    if (type === "回復") {
        const healAmount = rand(25, 45);
        const reward = rand(5, 15);
        game.hp = Math.min(game.maxHp, game.hp + healAmount);
        game.point += reward;
        game.resonance += rand(3, 7);

        log(`<span class="good">休息。</span> HPが${healAmount}回復し、${reward}ptを得た。`);
    }

    if (game.resonance >= 100) {
        game.resonance = 100;
        log(`<span class="warning">共鳴率が100%に到達。NOISEに捕捉された。</span>`);
        startNoiseBattle();
    }

    if (game.hp <= 0) {
        gameOver("スゥナは冒険の途中で力尽きた……");
        return;
    }

    updateView();
}

function randomEvent() {
    const roll = rand(1, 100);

    if (roll <= 25) {
        const reward = rand(5, 15);
        game.point += reward;
        log(`小さな記憶を見つけた。${reward}ptを得た。`);
    } else if (roll <= 40) {
        const reward = rand(20, 30);
        game.point += reward;
        log(`<span class="good">大きな記憶を見つけた。</span> ${reward}ptを得た。`);
    } else if (roll <= 55) {
        const damage = rand(10, 30);
        game.hp -= damage;
        log(`<span class="warning">不穏な気配。</span> ${damage}ダメージを受けた。`);
    } else if (roll <= 70) {
        game.actionFail += 2;
        log(`<span class="warning">NOISEの影が近づく。</span> 失敗値が2増加した。`);
    } else if (roll <= 85) {
        game.atk += 3;
        log(`<span class="good">怒りの記憶。</span> 攻撃力が3上がった。`);
    } else {
        log(`何も起きなかった。森は静かだ。`);
    }

    game.resonance += rand(3, 7);
}

function renderUpgrades() {
    const list = document.getElementById("upgradeList");
    list.innerHTML = "";

    addUpgrade(list, "攻撃力", "atk", costAtk());
    addUpgrade(list, "振れ幅", "range", costRange());
    addUpgrade(list, "シールド", "shieldValue", costShield());
    addUpgrade(list, "残留", "remain", costRemain());
    addUpgrade(list, "回復", "heal", costHeal());
    addUpgrade(list, "解除率", "cleanse", costCleanse());

    addActionUpgrade(list, "攻撃値", "actionAtk");
    addActionUpgrade(list, "防御値", "actionDef");
    addActionUpgrade(list, "回復値", "actionHeal");
}

function addUpgrade(parent, label, key, cost) {
    const row = document.createElement("div");
    row.className = "upgrade-row";

    row.innerHTML = `
        <span>${label}：${game[key]} / 必要pt ${cost}</span>
        <button class="small">＋</button>
        <span></span>
    `;

    row.querySelector("button").onclick = () => {
        if (game.point < cost) {
            log("ptが足りない。");
            return;
        }
        game.point -= cost;
        game[key] += 1;
        log(`${label}を強化した。`);
        updateView();
    };

    parent.appendChild(row);
}

function addActionUpgrade(parent, label, key) {
    const row = document.createElement("div");
    row.className = "upgrade-row";

    row.innerHTML = `
        <span>${label}：${game[key]} / 1pt</span>
        <button class="small">＋</button>
        <button class="small">－</button>
    `;

    const buttons = row.querySelectorAll("button");

    buttons[0].onclick = () => {
        if (game.point < 1) {
            log("ptが足りない。");
            return;
        }
        game.point -= 1;
        game[key] += 1;
        buildDeck("suuna");
		buildDeck("noise");
        log(`${label}を上げた。`);
        updateView();
    };

    buttons[1].onclick = () => {
        if (game.point < 1 || game[key] <= 1) {
            log("これ以上下げられない。");
            return;
        }
        game.point -= 1;
        game[key] -= 1;
        buildDeck("suuna");
		buildDeck("noise");
        log(`${label}を下げた。`);
        updateView();
    };

    parent.appendChild(row);
}

function costAtk() {
    return 3 + Math.floor(game.atk * 0.15);
}

function costRange() {
    return 1 + Math.floor(game.range * 0.05);
}

function costShield() {
    return 2 + Math.floor(game.shieldValue * 0.10);
}

function costRemain() {
    return 4 + Math.floor(game.remain * 0.20);
}

function costHeal() {
    return 2 + Math.floor(game.heal * 0.10);
}

function costCleanse() {
    return 3 + Math.floor(game.cleanse * 0.15);
}

function startNoiseBattle() {
    if (game.inBattle) return;

    game.inBattle = true;
    game.battleTurn = 0;
    game.noiseMaxHp = Math.floor(200 * (1 + game.resonance / 100));
    game.noiseHp = game.noiseMaxHp;
    game.noiseShield = 0;
    game.shield = 0;

	document
	    .getElementById(
	        "fieldScreen"
	    )
	    .classList.add("hidden");

	document
	    .getElementById(
	        "noiseBattleScreen"
	    )
	    .classList.remove("hidden");

	document
	    .getElementById(
	        "battleArea"
	    )
	    .classList.remove("hidden");

    log(`<span class="warning">NOISEが現れた。</span> 最終戦闘開始。`);
    updateView();
}

function weightedAction(actor){

    return drawCard(actor);

}

function battleTurn() {
    if (!game.inBattle) return;

    game.battleTurn++;
    game.noiseShield = 0;

    const suunaAction = weightedAction("suuna");
    const noiseAction = weightedAction("noise");

    log(`--- Turn ${game.battleTurn} ---`);

    resolveSuunaAction(suunaAction);

    if (game.noiseHp <= 0) {
        gameClear();
        return;
    }

    resolveNoiseAction(noiseAction);

    game.shield = Math.floor(game.shield * (game.remain / 100));

    if (game.hp <= 0) {
        gameOver("スゥナはNOISEに敗北した……");
        return;
    }

    updateView();
}

function resolveSuunaAction(action) {
    if (action === "攻撃") {
        let damage = game.atk + rand(0, game.range);
        damage = Math.max(0, damage - game.noiseShield);
        game.noiseHp -= damage;
        log(`スゥナの攻撃。NOISEに${damage}ダメージ。`);
    }

    if (action === "防御") {
        game.shield += game.shieldValue;
        log(`スゥナは身を守った。シールド${game.shieldValue}獲得。`);
    }

    if (action === "回復") {
        game.hp = Math.min(game.maxHp, game.hp + game.heal);
        log(`スゥナは呼吸を整えた。HP${game.heal}回復。`);
    }

    if (action === "失敗") {
        if (game.actionFail >= 25 && rand(1, 100) <= 20) {
            const damage = game.atk + game.range + rand(20, 40);
            game.noiseHp -= damage;
            log(`<span class="warning">臨界発動。</span> 暴発した力がNOISEに${damage}ダメージ。`);
        } else {
            log(`スゥナはうまく動けなかった。`);
        }
    }
}

function resolveNoiseAction(action) {
    const bonusRate = rand(0, Math.floor(game.resonance));
    const bonus = 1 + bonusRate / 100;

    const noiseAtk = Math.floor(20 * bonus);
    const noiseShieldValue = Math.floor(15 * bonus);
    const noiseHeal = Math.floor(12 * bonus);

    if (action === "攻撃") {
        let damage = noiseAtk;

        if (game.shield > 0) {
            const blocked = Math.min(game.shield, damage);
            game.shield -= blocked;
            damage -= blocked;
        }

        game.hp -= damage;

        log(`NOISEの攻撃。スゥナは${damage}ダメージを受けた。`);

        const abnormalRate = 10 + game.resonance / 10;
        if (rand(1, 100) <= abnormalRate) {
            const bad = ["浸食", "混乱", "弱化"][rand(0, 2)];
            log(`<span class="warning">${bad}の気配がスゥナを包む。</span> ※MVPでは演出のみ`);
        }
    }

    if (action === "防御") {
        game.noiseShield += noiseShieldValue;
        log(`NOISEは歪んだ防壁を作った。`);
    }

    if (action === "回復") {
        game.noiseHp = Math.min(game.noiseMaxHp, game.noiseHp + noiseHeal);
        log(`NOISEが再生した。HP${noiseHeal}回復。`);
    }

    if (action === "失敗") {
        log(`NOISEの形が一瞬崩れた。`);
    }
}

function gameClear() {
    log(`<span class="good">NOISEを討伐した。</span>`);
    document.getElementById("battleButton").disabled = true;

    setTimeout(() => {
        alert("勝利！\nスゥナは失われた力を取り戻した。");
        location.reload();
    }, 300);
}

function gameOver(message) {
    log(`<span class="warning">${message}</span>`);
    setTimeout(() => {
        alert("敗北……\n" + message);
        location.reload();
    }, 300);
}

function openUpgrade(){
    document.getElementById(
        "upgradeModal"
    ).style.display = "flex";
}

function openStatus(){
    document.getElementById(
        "statusModal"
    ).style.display = "flex";
}

function closeModal(id){
    document.getElementById(id)
        .style.display = "none";
}

function openStory(){

    storyIndex = 0;

    document
        .getElementById("startScreen")
        .classList.add("hidden");

    document
        .getElementById("storyScreen")
        .classList.remove("hidden");

    showStoryPage();

}

function showStoryPage(){

    const page =
        storyPages[storyIndex];

    document
        .getElementById("storyImage")
        .src = page.image;

	const storyText =
	    document.getElementById(
	        "storyText"
	    );

	storyText.classList.remove(
	    "storyTextAnimate"
	);

	void storyText.offsetWidth;

	storyText.innerText = page.text;

	storyText.classList.add(
	    "storyTextAnimate"
	);

	const isLastPage =
	    storyIndex >=
	    storyPages.length - 1;

	document
	    .getElementById(
	        "storyStartButton"
	    )
	    .classList.toggle(
	        "hidden",
	        !isLastPage
	    );

	document
	    .getElementById(
	        "nextStoryButton"
	    )
	    .classList.toggle(
	        "hidden",
	        isLastPage
	    );

}

function nextStory(){

    if(
        storyIndex >=
        storyPages.length - 1
    ){
        return;
    }

    storyIndex++;

    showStoryPage();

}

function startFromStory(){

    document
        .getElementById("storyScreen")
        .classList.add("hidden");

    startGame();

}

function buildDeck(actor){

    let deckTarget;
    let discardTarget;

    if(actor === "noise"){

        deckTarget = "noiseDeck";
        discardTarget = "noiseDiscard";

    }else{

        deckTarget = "deck";
        discardTarget = "discard";

    }

    game[deckTarget] = [];
    game[discardTarget] = [];

    for(let i=0;i<game.actionAtk;i++){
        game[deckTarget].push("攻撃");
    }

    for(let i=0;i<game.actionDef;i++){
        game[deckTarget].push("防御");
    }

    for(let i=0;i<game.actionHeal;i++){
        game[deckTarget].push("回復");
    }

    for(let i=0;i<game.actionFail;i++){
        game[deckTarget].push("失敗");
    }

    shuffleDeck(deckTarget);

}

function shuffleDeck(deckName){

    const deck = game[deckName];

    for(
        let i = deck.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            deck[i],
            deck[j]
        ] = [
            deck[j],
            deck[i]
        ];

    }

}

function drawCard(actor){

    let deckName;
    let discardName;

    if(actor === "noise"){

        deckName = "noiseDeck";
        discardName = "noiseDiscard";

    }else{

        deckName = "deck";
        discardName = "discard";

    }

    if(game[deckName].length <= 0){

        game[deckName] = [
            ...game[discardName]
        ];

        game[discardName] = [];

        shuffleDeck(deckName);

        log(
            `<span class='warning'>
            ${actor === "noise" ? "NOISE" : "スゥナ"}
            のデッキ再構築。
            </span>`
        );

    }

    const card =
        game[deckName].shift();

    game[discardName].push(card);

    return card;

}
